<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
</head>

<body>

    <h1>{{ title }}</h1>

    <h2>Our Active Users</h2>

    <ul>
        {% for user in users %}
            <li>
                <strong>{{ user.full_name }}</strong>
                - {{ user.email }}
            </li>
        {% endfor %}
    </ul>

</body>
</html>
